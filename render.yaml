# Render Blueprint — deploys this Vite/React site as a static site.
# In Render: New → Blueprint → pick this repo → Apply.
services:
  - type: web
    name: nfc-restaurants
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    # SPA fallback so every path serves the app
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
