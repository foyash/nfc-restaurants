# Render Blueprint — deploys this Vite/React site as a static site.
# In Render: New → Blueprint → pick this repo → Apply.
services:
  - type: web
    name: nfc-restaurants
    runtime: static
    # --include=dev ensures Vite (a devDependency) is installed even if NODE_ENV=production
    buildCommand: npm ci --include=dev && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: NODE_VERSION
        value: "20"
    # SPA fallback so every path serves the app
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
